<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
:root{
  --ink:#24243c; --ink-2:#55597a; --navy:#2c3263; --blue:#3c549c; --blue-2:#546cb4; --sky:#8fb4e6; --sky-soft:#e9f0fb;
  --paper:#fbfaf6; --lace:#e7e1d6; --lace-2:#f3efe7; --blush:#f2c6c1; --danger:#b4505a;
  --font:"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,#7d9cc8,#b9cbe3 55%,#d8e2ef);width:1120px;height:700px;position:relative;overflow:hidden}
.label{position:absolute;font-size:13px;color:#fff;background:rgba(20,24,50,.55);padding:3px 10px;border-radius:10px}

/* ── 对话框 ── */
.chat{position:absolute;left:60px;top:60px;width:380px;height:580px;border-radius:18px;overflow:hidden;background:var(--paper);
  box-shadow:0 18px 40px rgba(20,30,70,.35),0 0 0 1px rgba(44,50,99,.25);display:flex;flex-direction:column}
.bar{position:relative;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:12px 12px 20px;display:flex;align-items:center;gap:10px}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:10px;
  background:radial-gradient(circle at 8px 10px,var(--paper) 7px,transparent 7.5px) 0 0/16px 10px repeat-x}   /* 女仆花边 */
.avatar{width:38px;height:38px;border-radius:50%;background:#fff center/cover;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.who{flex:1;min-width:0}
.name{font-size:15px;font-weight:700;letter-spacing:.5px}
.status{font-size:11.5px;opacity:.85;display:flex;align-items:center;gap:5px;margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:#9be3b4;box-shadow:0 0 0 2px rgba(155,227,180,.25)}
.ibtn{width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:14px;display:grid;place-items:center}
.msgs{flex:1;overflow:hidden;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,#f5f8fd,var(--paper) 40%)}
.day{align-self:center;font-size:11px;color:var(--ink-2);background:var(--lace-2);padding:2px 10px;border-radius:10px}
.row{display:flex;flex-direction:column;max-width:80%}
.row.her{align-self:flex-start}.row.me{align-self:flex-end;align-items:flex-end}
.b{padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.6;word-break:break-word}
.her .b{background:#fff;border:1px solid var(--lace);border-top-left-radius:6px;box-shadow:0 1px 2px rgba(36,36,60,.05)}
.me .b{background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff;border-top-right-radius:6px}
.dsh .b{background:var(--sky-soft);border-color:#cfdcf1}
.tag{font-size:10.5px;color:var(--blue);background:#fff;border:1px solid #cfdcf1;border-radius:9px;padding:1px 8px;margin-bottom:4px;align-self:flex-start}
.vbtn{margin-top:6px;align-self:flex-start;font-size:12px;color:var(--blue);background:#fff;border:1px solid #cfdcf1;border-radius:12px;padding:3px 10px}
.tool{font-size:11.5px;color:var(--ink-2);margin:4px 0 0 6px}
.tool b{color:#3f8f63;font-weight:600}
.card{align-self:stretch;background:#fff;border:1px solid var(--lace);border-radius:14px;padding:12px 14px;position:relative;margin-top:2px}
.card::before{content:"";position:absolute;left:12px;right:12px;top:-1px;height:4px;border-radius:0 0 4px 4px;background:var(--blue)}
.card h4{margin:2px 0 4px;font-size:13.5px}
.card p{margin:0 0 10px;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.acts{display:flex;gap:8px;justify-content:flex-end}
.btn{font:inherit;font-size:12.5px;border-radius:14px;padding:5px 14px;border:1px solid var(--lace);background:#fff;color:var(--ink)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--sky)}
.input{padding:10px 12px 12px;border-top:1px solid var(--lace-2);display:flex;gap:8px;align-items:flex-end;background:#fff}
.ta{flex:1;min-height:38px;border:1px solid var(--lace);border-radius:19px;padding:9px 14px;font-size:13px;color:#a09a90;background:var(--paper)}
.send{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:16px}

/* ── 右键菜单 ── */
.menu{position:absolute;left:640px;top:250px;width:216px;background:var(--paper);border-radius:16px;overflow:hidden;
  box-shadow:0 14px 32px rgba(20,30,70,.32),0 0 0 1px rgba(44,50,99,.22);font-size:13px}
.mh{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:10px 14px 16px;position:relative;display:flex;align-items:center;gap:8px}
.mh::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:8px;background:radial-gradient(circle at 6px 8px,var(--paper) 5.5px,transparent 6px) 0 0/12px 8px repeat-x}
.mh .avatar{width:26px;height:26px}
.mh small{display:block;font-size:11px;opacity:.85}
.mi{display:flex;align-items:center;gap:10px;padding:7px 10px;margin:1px 6px;border-radius:10px}
.mi .ic{width:20px;text-align:center}
.mi.hover{background:var(--sky-soft);color:var(--navy)}
.mi.dis{color:#b0aca3}.mi .hint{margin-left:auto;font-size:10.5px}
.sep{height:0;border-top:1px dashed var(--lace);margin:5px 14px}
.tog{margin-left:auto;width:30px;height:17px;border-radius:9px;background:var(--blue);position:relative}
.tog::after{content:"";position:absolute;right:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff}
.mi.quit{color:var(--danger)}
.pet{position:absolute;left:820px;top:330px;width:300px;height:225px;background:center/contain no-repeat}
.list{padding:4px 0 8px}
</style></head><body>
